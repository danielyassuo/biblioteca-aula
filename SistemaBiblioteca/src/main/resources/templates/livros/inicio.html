<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livros</title>
</head>
<body>
<h1>Livros</h1>
<a th:href="@{/livros/novo}">Cadastrar novo livro</a>

<table>
    <tr>
        <th>Título</th>
        <th>Autor</th>
        <th>ISBN</th>
        <th>Ações</th>
    </tr>
    <tr th:each="livro, stat : ${livros}">
        <td th:text="${livro.titulo}"></td>
        <td th:text="${livro.autor}"></td>
        <td th:text="${livro.isbn}"></td>
        <td>
            <a th:href="@{/livros/editar/{id}(id=${stat.index})}">Editar</a>
            <a th:href="@{/livros/deletar/{id}(id=${stat.index})}">Excluir</a>
        </td>
    </tr>
</table>

<a th:href="@{/}">Voltar</a>
</body>
</html>
