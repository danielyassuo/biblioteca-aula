<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Autores</title>
</head>
<body>
<h1>Autores</h1>
<a th:href="@{/autores/novo}">Cadastrar novo autor</a>

<table>
    <tr>
        <th>Nome</th>
        <th>Nacionalidade</th>
        <th>Data de Nascimento</th>
    </tr>
    <tr th:each="autor : ${autores}">
        <td th:text="${autor.nome}"></td>
        <td th:text="${autor.nacionalidade}"></td>
        <td th:text="${autor.dataNascimento}"></td>
    </tr>
</table>

<a th:href="@{/}">Voltar</a>
</body>
</html>
